name: Base Search 1.0

on:
  push:
    branches: [master, main, "codex/base-search-1.0"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.96.0"
  NODE_VERSION: "22.22.0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - run: npm ci --prefix app-ui
      - run: npm --prefix app-ui run test:unit
      - run: npm --prefix app-ui run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p base-search-core --all-targets
      - run: cargo clippy --locked -p base-search-core --all-targets -- -D warnings
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./app-ui/package.json').version")" = "$version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$version"
          cargo metadata --locked --no-deps --format-version 1 | node -e 'const fs = require("node:fs"); const packages = JSON.parse(fs.readFileSync(0, "utf8")).packages; const version = require("./package.json").version; if (packages.some(p => p.version !== version)) process.exit(1);'

  packages:
    name: Package and verify ${{ matrix.asset }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            build_args: --no-bundle
            asset: windows-x64
          - os: macos-15
            build_args: --bundles app
            asset: macos-arm64
          - os: macos-15-intel
            build_args: --bundles app
            asset: macos-x64
          - os: ubuntu-22.04
            build_args: --bundles deb
            asset: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-daemon
      - run: npm ci
      - run: npm ci --prefix app-ui
      - name: Build desktop package
        shell: bash
        run: npm run build -- ${{ matrix.build_args }} --ci -- --locked
      - name: Create portable archive
        id: stage
        shell: bash
        run: |
          file=$(node scripts/v1/stage-portable.mjs "${{ matrix.asset }}")
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
      - name: Stage the optional Debian package
        id: debian
        if: runner.os == 'Linux'
        run: |
          file=$(node scripts/v1/stage-package.mjs linux-x64)
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
      - name: Unzip and exercise the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.stage.outputs.file }}
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Base Search portable'
          Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $folder
          $name = [IO.Path]::GetFileNameWithoutExtension($env:ARCHIVE)
          node scripts/v1/smoke-package.mjs (Join-Path $folder $name 'Start Base Search.cmd')
          exit $LASTEXITCODE
      - name: Unzip and exercise the macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE: ${{ steps.stage.outputs.file }}
        run: |
          folder="$RUNNER_TEMP/Base Search portable"
          ditto -x -k "$ARCHIVE" "$folder"
          filename=$(basename "$ARCHIVE")
          package="$folder/${filename%.zip}"
          codesign --verify --deep --strict "$package/Base Search.app"
          node scripts/v1/smoke-package.mjs "$package/Start Base Search.command"
      - name: Exercise the Ubuntu 22.04 launcher and Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCHIVE: ${{ steps.stage.outputs.file }}
          INSTALLER: ${{ steps.debian.outputs.file }}
        run: |
          folder="$RUNNER_TEMP/Base Search portable"
          mkdir -p "$folder"
          tar -xzf "$ARCHIVE" -C "$folder"
          filename=$(basename "$ARCHIVE")
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$folder/${filename%.tar.gz}/Start Base Search.sh"
          sudo apt-get install -y "$GITHUB_WORKSPACE/$INSTALLER"
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$(command -v base-search)"
      - uses: actions/upload-artifact@v4
        with:
          name: BaseSearch-${{ matrix.asset }}
          path: |
            ${{ steps.stage.outputs.file }}
            ${{ steps.debian.outputs.file }}
          compression-level: 0
          if-no-files-found: error

  ubuntu-24:
    name: Exercise the Linux launcher on Ubuntu 24.04
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: BaseSearch-linux-x64
          path: release_packages
      - shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-daemon "$GITHUB_WORKSPACE"/release_packages/*.deb
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$(command -v base-search)"
          folder="$RUNNER_TEMP/Base Search portable"
          mkdir -p "$folder"
          archives=(release_packages/*.tar.gz)
          filename=$(basename "${archives[0]}")
          tar -xzf "${archives[0]}" -C "$folder"
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$folder/${filename%.tar.gz}/Start Base Search.sh"

  release:
    name: Publish verified packages
    if: github.ref_type == 'tag'
    needs: [packages, ubuntu-24]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: BaseSearch-*
          merge-multiple: true
      - name: Build checksums and publish
        run: |
          cd release_assets
          sha256sum BaseSearch-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release_assets/* --verify-tag --generate-notes --latest --title "Base Search $GITHUB_REF_NAME"
