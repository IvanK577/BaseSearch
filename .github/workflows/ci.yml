name: Base Search 1.0

on:
  push:
    branches: [master, main, "codex/base-search-1.0"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: "1.96.0"
  NODE_VERSION: "22.22.0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - run: npm ci --prefix app-ui
      - run: npm --prefix app-ui run test:unit
      - run: npm --prefix app-ui run build
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p base-search-core --all-targets
      - run: cargo clippy --locked -p base-search-core --all-targets -- -D warnings
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(node -p "require('./app-ui/package.json').version")" = "$version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$version"
          cargo metadata --locked --no-deps --format-version 1 | node -e 'const fs = require("node:fs"); const packages = JSON.parse(fs.readFileSync(0, "utf8")).packages; const version = require("./package.json").version; if (packages.some(p => p.version !== version)) process.exit(1);'

  packages:
    name: Package and verify ${{ matrix.asset }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: nsis
            asset: windows-x64
          - os: macos-15
            bundle: dmg
            asset: macos-arm64
          - os: macos-15-intel
            bundle: dmg
            asset: macos-x64
          - os: ubuntu-22.04
            bundle: deb
            asset: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-daemon
      - name: Configure macOS release signing
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing macOS release signing variable $name" >&2
              exit 1
            fi
            delimiter=$(openssl rand -hex 24)
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done
      - run: npm ci
      - run: npm ci --prefix app-ui
      - name: Build desktop package
        shell: bash
        run: npm run build -- --bundles "${{ matrix.bundle }}" --ci -- --locked
      - name: Stage package file
        id: stage
        shell: bash
        run: |
          file=$(node scripts/v1/stage-package.mjs "${{ matrix.asset }}")
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"
      - name: Install and exercise Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.stage.outputs.file }}
        run: |
          $installedPath = Join-Path $env:RUNNER_TEMP 'base-search-installed'
          $installer = (Resolve-Path -LiteralPath $env:INSTALLER).Path
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installedPath") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows installation exited with $($install.ExitCode)" }
          node scripts/v1/smoke-package.mjs (Join-Path $installedPath 'base-search.exe')
          exit $LASTEXITCODE
      - name: Mount and exercise macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER: ${{ steps.stage.outputs.file }}
        run: |
          set -euo pipefail
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$INSTALLER"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app_dir="$mount_dir/Base Search.app"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            codesign --verify --deep --strict "$app_dir"
            xcrun stapler validate "$app_dir"
          fi
          node scripts/v1/smoke-package.mjs "$app_dir/Contents/MacOS/base-search"
      - name: Install and exercise Ubuntu 22.04 package
        if: runner.os == 'Linux'
        shell: bash
        env:
          INSTALLER: ${{ steps.stage.outputs.file }}
        run: |
          sudo apt-get install -y "$GITHUB_WORKSPACE/$INSTALLER"
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$(command -v base-search)"
      - uses: actions/upload-artifact@v4
        with:
          name: BaseSearch-${{ matrix.asset }}
          path: ${{ steps.stage.outputs.file }}
          compression-level: 0
          if-no-files-found: error

  ubuntu-24:
    name: Install the same package on Ubuntu 24.04
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: BaseSearch-linux-x64
          path: release_packages
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-daemon "$GITHUB_WORKSPACE"/release_packages/*.deb
          dbus-run-session -- xvfb-run -a node scripts/v1/smoke-package.mjs "$(command -v base-search)"

  release:
    name: Publish verified packages
    if: github.ref_type == 'tag'
    needs: [packages, ubuntu-24]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: BaseSearch-*
          merge-multiple: true
      - name: Build checksums and publish
        run: |
          cd release_assets
          sha256sum BaseSearch-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release_assets/* --verify-tag --generate-notes --title "Base Search $GITHUB_REF_NAME"
