[package]
name = "base-search"
version = "2.2.0"
edition = "2024"
description = "Local search over large Excel databases"
license = "MIT"

[lib]
name = "base_search"
path = "src/lib.rs"

[features]
default = ["browser"]
duckdb-olap = ["dep:duckdb"]
# Exact feature contract used by every production package. Keeping this as a
# named feature stops CI and the platform scripts from quietly shipping
# something other than the tested set.
#
# `duckdb-olap` is deliberately NOT part of it. The projection it maintains only
# answers analytics queries that carry no free text, and it goes stale the
# moment anything is imported — nothing rebuilds it except an admin action — so
# in practice it stopped answering after the first import. Shipping a second
# engine that has never run in front of users, and that has to agree with the
# SQLite path on every number, is risk without a benefit anyone asked for. The
# feature still builds and its parity tests still run; enable it again once the
# projection is rebuilt automatically after an import.
release-package = ["browser", "eframe/wgpu"]
# Local browser workspace: an Axum server on 127.0.0.1 that serves the
# embedded React UI and the /api endpoints on top of the same core.
browser = [
    "dep:tokio",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio-util",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:argon2",
    "dep:getrandom",
    "dep:if-addrs",
    "dep:rpassword",
]

[[bin]]
name = "BaseSearch"
path = "src/main.rs"

[[bin]]
name = "base-search-cli"
path = "src/bin/cli.rs"

[dependencies]
calamine = { version = "0.35.0", features = ["dates"] }
chrono = "0.4"
csv = "1.4.0"
fs2 = "0.4.3"
duckdb = { version = "1.10504.0", features = ["bundled"], optional = true }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34.3"
egui_extras = "0.34.3"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "hooks"] }
rust_xlsxwriter = { version = "0.95.0", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

# Browser workspace (optional, enabled by the default `browser` feature).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio", "query"], optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "limit"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["io"], optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.2", optional = true }
if-addrs = { version = "0.15.0", optional = true }
rpassword = { version = "7.5.4", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
